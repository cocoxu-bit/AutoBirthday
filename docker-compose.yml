version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: evolution_api_autobirthday
    restart: always
    ports:
      - "8080:8080"
    environment:
      # --- SERVIDOR Y SEGURIDAD ---
      SERVER_PORT: 8080
      SERVER_TYPE: http
      SERVER_URL: http://158.179.209.157:8080
      AUTHENTICATION_API_KEY: autobirthday-dev-key-2024
      
      # --- BASE DE DATOS LOCAL / CACHE ---
      DATABASE_PROVIDER: local
      DATABASE_CONNECTION_URI: sqlite://./data/evolution.db
      
      # --- OPTIMIZACIÓN ULTRA-LIGERA DE MEMORIA RAM ---
      # 1. Desactivar descarga y persistencia de mensajes históricos (Ahorro ~80% de RAM)
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_DATA_MESSAGES: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      STORE_MESSAGES: "false"
      STORE_MESSAGE_UP: "false"

      # 2. Conservar sincronización ligera de contactos y grupos (<1MB por instancia)
      STORE_CONTACTS: "true"
      STORE_CHATS: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      # 3. Webhook de AutoBirthday
      WEBHOOK_GLOBAL_ENABLED: "false"
      
      # 4. Optimización de Node.js Runtime
      NODE_OPTIONS: "--max-old-space-size=512 --enable-source-maps=false"

    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - autobirthday_net

volumes:
  evolution_instances:
  evolution_store:

networks:
  autobirthday_net:
    driver: bridge
